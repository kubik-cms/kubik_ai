name: JavaScript

on:
  push:
    paths:
      - "package/**"
      - ".github/workflows/javascript.yml"
  pull_request:
    paths:
      - "package/**"
      - ".github/workflows/javascript.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: package
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package/package-lock.json

      - run: npm ci
      - run: npm run build
